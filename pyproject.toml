[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "route-resilience-ai"
version = "0.1.0"
description = "Occlusion-robust road extraction and graph-theoretic mobility resilience analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "networkx>=3.4,<4",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "scikit-image>=0.25,<1",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "ml"}

[tool.setuptools.packages.find]
where = ["ml"]

[tool.pytest.ini_options]
pythonpath = [".", "ml"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
